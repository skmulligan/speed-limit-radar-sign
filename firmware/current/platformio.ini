[platformio]
default_envs = diagnostic

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
; The stock board profile is N8 without PSRAM. Override for the observed N16R8.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
monitor_speed = 115200
; COM bridge produced framing errors after switching to 460800 in bench reads.
upload_speed = 115200

[env:diagnostic]
build_src_filter = +<main.cpp>

[env:radar_receive]
build_src_filter = +<radar_receive.cpp>

[env:display_io]
build_src_filter = +<display_io.cpp>

[env:panel_bench]
build_src_filter = +<panel_bench.cpp>

[env:battery_panel_bench]
build_src_filter = +<panel_bench.cpp>
build_flags =
    ${env.build_flags}
    -DBATTERY_PANEL_BENCH

[env:daylight_panel_bench]
build_src_filter = +<panel_bench.cpp>
build_flags =
    ${env.build_flags}
    -DBATTERY_PANEL_BENCH
    -DDAYLIGHT_PANEL_BENCH


[env:radar_query]
build_src_filter = +<radar_query.cpp>

[env:live_bench]
build_src_filter = +<live_bench.cpp>

[env:warning_bench]
build_src_filter = +<warning_bench.cpp>

[env:battery_bench]
build_src_filter = +<warning_bench.cpp>
build_flags =
    ${env.build_flags}
    -DBATTERY_BENCH

[env:daylight_radar_bench]
build_src_filter = +<warning_bench.cpp>
build_flags =
    ${env.build_flags}
    -DBATTERY_BENCH
    -DDAYLIGHT_RADAR_BENCH

[env:daylight_radar_diagnostic]
extends = env:daylight_radar_bench
build_flags =
    ${env:daylight_radar_bench.build_flags}
    -DDAYLIGHT_STARTUP_CHECK

[env:continuous_radar]
extends = env:daylight_radar_diagnostic
build_flags =
    ${env:daylight_radar_diagnostic.build_flags}
    -DCONTINUOUS_RADAR

; Experimental RTC + durable episode log + BLE; retains existing targets.
[env:tracking]
build_src_filter = +<tracking.cpp>
board_build.filesystem = littlefs
